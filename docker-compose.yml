# Local full stack: MongoDB + backend API + workers + frontend.
# Backend secrets come from app/backend/.env (see README). Values under
# `environment` override that file for the container network.

x-backend: &backend
  image: doggo-backend
  build:
    context: app/backend
  env_file: app/backend/.env
  environment: &backend-env
    MONGODB_URI: mongodb://mongo:27017
    FRONTEND_URL: http://localhost:3000
    # Plain-http localhost: production mode marks the session cookie `secure`,
    # which browsers drop over http. Set to production behind HTTPS.
    NODE_ENV: development
  depends_on:
    mongo:
      condition: service_healthy
  restart: unless-stopped

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *backend
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
      PORT: 8000

  ingestion-worker:
    <<: *backend
    command: ["node", "dist/apps/ingestion-worker/main.js"]

  queue-producer:
    <<: *backend
    command: ["node", "dist/apps/queue-producer/main.js"]

  notification-worker:
    <<: *backend
    command: ["node", "dist/apps/notification-worker/main.js"]

  qualification-worker:
    <<: *backend
    command: ["node", "dist/apps/qualification-worker/main.js"]

  frontend:
    image: doggo-frontend
    build:
      context: app/frontend
      args:
        # Browser calls the API via the published host port
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
