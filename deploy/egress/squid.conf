# Egress proxy (ASVS V13.2.5, V13.2.4): the application containers have no route to the
# internet (internal Docker network). Their only way out is this proxy, which allows CONNECT
# tunnels (TLS end to end) to the hosts in allowlist.txt on the HTTPS/SMTP ports, and nothing
# else. Every decision is logged (the image tails /var/log/squid/*.log to stdout) and shipped to Loki.
http_port 3128

acl allowed_hosts dstdomain "/etc/squid/allowlist.txt"
acl tls_ports port 443 465 587
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny CONNECT !tls_ports
http_access allow CONNECT allowed_hosts
http_access deny all

# No caching, no identifying headers
cache deny all
forwarded_for delete
via off

access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log
logfile_rotate 0
pid_filename none
