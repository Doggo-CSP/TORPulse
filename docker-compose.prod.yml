# Production overlay: HTTPS through Caddy, TLS on every internal hop, MongoDB with authentication,
# secrets as files, no direct internet access for the app (egress proxy with an allowlist), and
# logs shipped to a separate, authenticated Loki store. Only ports 80/443 are published.
#
#   cp deploy/prod.env.example deploy/prod.env      # non-secret settings, edit
#   ./deploy/init-secrets.sh                        # secrets + internal CA and certificates
#   # edit deploy/egress/allowlist.txt: put your SMTP_HOST in place of smtp.example.com
#   APP_DOMAIN=torpulse.example.com \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# DNS: point APP_DOMAIN and api.APP_DOMAIN at this host (ports 80 and 443 open) so Caddy can get
# Let's Encrypt certificates. Google Cloud console: add https://api.APP_DOMAIN/auth/google/callback
# as an authorised redirect URI. Grafana (logs): http://127.0.0.1:3001 on the host, e.g. over SSH.
# Local test: APP_DOMAIN=localhost (Caddy's local CA; *.localhost resolves to 127.0.0.1).
#
# Networks (ASVS V13.2.5, V12.3.1, V13.2.1):
#   edge        internet-facing: Caddy (ACME + clients) and the egress proxy
#   app         internal (no internet): Caddy, api, frontend, workers, mongo, egress proxy
#   logging     internal: Alloy, Grafana, Loki gateway
#   loki-store  internal: Loki gateway and Loki only
#   grafana-ui  only so Grafana's loopback port can be published

x-prod-backend: &prod-backend
  # Replace the shared app/backend/.env with non-secret settings + per-service secrets
  env_file: !override [deploy/prod.env]
  networks: !override [app]
  logging: &json-logs
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-prod-env: &prod-env
  # Secure + __Host- session cookie, trust proxy (Caddy), HSTS
  NODE_ENV: production
  FRONTEND_URL: https://${APP_DOMAIN:?set APP_DOMAIN}
  MONGODB_URI: !reset null
  MONGODB_URI_FILE: /run/secrets/mongodb_uri
  # The only way out: the egress proxy. fetch() and https.request honour these with
  # NODE_USE_ENV_PROXY; nodemailer uses SMTP_PROXY. Internal services are reached directly.
  NODE_USE_ENV_PROXY: "1"
  HTTPS_PROXY: http://egress-proxy:3128
  HTTP_PROXY: http://egress-proxy:3128
  NO_PROXY: mongo,api,frontend,localhost,127.0.0.1
  SMTP_PROXY: http://egress-proxy:3128

services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    secrets: [internal_ca]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - frontend
    networks: [edge, app]
    logging: *json-logs
    restart: unless-stopped

  # Allowlisting forward proxy: CONNECT only, to the hosts in deploy/egress/allowlist.txt
  egress-proxy:
    image: ubuntu/squid:6.6-24.04_beta
    volumes:
      - ./deploy/egress/squid.conf:/etc/squid/squid.conf:ro
      - ./deploy/egress/allowlist.txt:/etc/squid/allowlist.txt:ro
    networks: [edge, app]
    logging: *json-logs
    restart: unless-stopped

  # Authentication on (root user from a secret) + an app user with readWrite on one database,
  # TLS required for every connection. Separate volume: an existing no-auth volume would skip
  # the init scripts (migrate with mongodump/mongorestore).
  mongo:
    image: mongo:7.0.25
    ports: !reset []
    command:
      - --tlsMode=requireTLS
      - --tlsCertificateKeyFile=/run/secrets/mongo_server_pem
      - --tlsCAFile=/run/secrets/internal_ca
      - --tlsAllowConnectionsWithoutCertificates
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_APP_DB: ${MONGODB_DATABASE:-torpulse}
      MONGO_APP_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets: [mongo_root_password, mongo_app_password, mongo_server_pem, internal_ca]
    volumes: !override
      - mongo-data-prod:/data/db
      - ./deploy/mongo/create-app-user.js:/docker-entrypoint-initdb.d/create-app-user.js:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --tls
        - --tlsCAFile=/run/secrets/internal_ca
        - --host=mongo
        - --eval
        - "db.adminCommand({ ping: 1 })"
    networks: !override [app]
    logging: *json-logs

  # Least privilege for secrets (ASVS V13.3.2): each service only gets the secrets it uses
  api:
    <<: *prod-backend
    ports: !reset []
    environment:
      <<: *prod-env
      SERVICE_NAME: api
      PORT: 8000
      # Caddy -> API over TLS (internal CA)
      TLS_CERT_FILE: /run/secrets/api_crt
      TLS_KEY_FILE: /run/secrets/api_key
      GOOGLE_CALLBACK_URL: https://api.${APP_DOMAIN}/auth/google/callback
      SESSION_SECRET_FILE: /run/secrets/session_secret
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      SMTP_PASS_FILE: /run/secrets/smtp_pass
    secrets:
      [mongodb_uri, internal_ca, api_crt, api_key, session_secret, google_client_secret, smtp_pass]

  ingestion-worker:
    <<: *prod-backend
    environment:
      <<: *prod-env
      SERVICE_NAME: ingestion-worker
      GOOGLE_API_KEY_FILE: /run/secrets/google_api_key
    secrets: [mongodb_uri, internal_ca, google_api_key]

  queue-producer:
    <<: *prod-backend
    environment:
      <<: *prod-env
      SERVICE_NAME: queue-producer
    secrets: [mongodb_uri, internal_ca]

  notification-worker:
    <<: *prod-backend
    environment:
      <<: *prod-env
      SERVICE_NAME: notification-worker
      SMTP_PASS_FILE: /run/secrets/smtp_pass
    secrets: [mongodb_uri, internal_ca, smtp_pass]

  qualification-worker:
    <<: *prod-backend
    environment:
      <<: *prod-env
      SERVICE_NAME: qualification-worker
      GOOGLE_API_KEY_FILE: /run/secrets/google_api_key
    secrets: [mongodb_uri, internal_ca, google_api_key]

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: https://api.${APP_DOMAIN}
    ports: !reset []
    environment:
      # Caddy -> frontend over TLS (tls-entry.mjs in front of Next.js)
      TLS_CERT_FILE: /run/secrets/frontend_crt
      TLS_KEY_FILE: /run/secrets/frontend_key
    secrets: [frontend_crt, frontend_key]
    networks: !override [app]
    logging: *json-logs

  # ---- Logging (ASVS V16.4.2, V16.4.3, V13.2.1): a store the application cannot reach ----
  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/logging/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [loki-store]
    restart: unless-stopped

  # TLS + per-client accounts in front of Loki (push-only for Alloy, read-only for Grafana)
  loki-gateway:
    image: caddy:2.10-alpine
    volumes:
      - ./deploy/logging/loki-gateway.Caddyfile:/etc/caddy/Caddyfile:ro
    secrets: [loki_gateway_crt, loki_gateway_key, loki_writer_hash, loki_reader_hash]
    depends_on: [loki]
    networks: [logging, loki-store]
    logging: *json-logs
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.2
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./deploy/logging/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    secrets: [loki_writer_password, internal_ca]
    depends_on: [loki-gateway]
    networks: [logging]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      # Host loopback only: reach it through an SSH tunnel, not from the internet
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets: [grafana_admin_password, loki_reader_password, internal_ca]
    volumes:
      - ./deploy/logging/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki-gateway]
    # `logging` to reach the Loki gateway; `grafana-ui` only so the loopback port can be published
    networks: [logging, grafana-ui]
    restart: unless-stopped

networks:
  edge:
  app:
    internal: true
  logging:
    internal: true
  loki-store:
    internal: true
  grafana-ui:

secrets:
  mongo_root_password:
    file: ./deploy/secrets/mongo_root_password
  mongo_app_password:
    file: ./deploy/secrets/mongo_app_password
  mongodb_uri:
    file: ./deploy/secrets/mongodb_uri
  internal_ca:
    file: ./deploy/secrets/internal_ca.pem
  mongo_server_pem:
    file: ./deploy/secrets/mongo_server.pem
  api_crt:
    file: ./deploy/secrets/api.crt
  api_key:
    file: ./deploy/secrets/api.key
  frontend_crt:
    file: ./deploy/secrets/frontend.crt
  frontend_key:
    file: ./deploy/secrets/frontend.key
  loki_gateway_crt:
    file: ./deploy/secrets/loki_gateway.crt
  loki_gateway_key:
    file: ./deploy/secrets/loki_gateway.key
  loki_writer_password:
    file: ./deploy/secrets/loki_writer_password
  loki_writer_hash:
    file: ./deploy/secrets/loki_writer_hash
  loki_reader_password:
    file: ./deploy/secrets/loki_reader_password
  loki_reader_hash:
    file: ./deploy/secrets/loki_reader_hash
  session_secret:
    file: ./deploy/secrets/session_secret
  google_client_secret:
    file: ./deploy/secrets/google_client_secret
  google_api_key:
    file: ./deploy/secrets/google_api_key
  smtp_pass:
    file: ./deploy/secrets/smtp_pass
  grafana_admin_password:
    file: ./deploy/secrets/grafana_admin_password

volumes:
  caddy-data:
  caddy-config:
  mongo-data-prod:
  loki-data:
  alloy-data:
  grafana-data:
